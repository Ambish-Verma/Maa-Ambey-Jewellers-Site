<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="kadaOuter" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF0A0"/>
      <stop offset="25%" stop-color="#C8860A"/>
      <stop offset="50%" stop-color="#7A4F00"/>
      <stop offset="75%" stop-color="#C8860A"/>
      <stop offset="100%" stop-color="#FFF0A0"/>
    </linearGradient>
    <radialGradient id="kadaFace" cx="40%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#FFF0A0"/>
      <stop offset="60%" stop-color="#C8860A"/>
      <stop offset="100%" stop-color="#8B5E00"/>
    </radialGradient>
  </defs>

  <!-- Kada - thick rigid gold bracelet, viewed at slight angle showing 3D -->
  <!-- Outer ring (thick band) -->
  <ellipse cx="100" cy="110" rx="78" ry="32" fill="none" stroke="url(#kadaOuter)" stroke-width="22"/>

  <!-- Top highlight band -->
  <ellipse cx="100" cy="110" rx="78" ry="32" fill="none" stroke="#FFF0A0" stroke-width="3" opacity="0.45"/>

  <!-- Bottom shadow band -->
  <ellipse cx="100" cy="114" rx="78" ry="33" fill="none" stroke="#5A3800" stroke-width="4" opacity="0.3"/>

  <!-- Engraved pattern: decorative lines on the band face -->
  <ellipse cx="100" cy="110" rx="68" ry="25" fill="none" stroke="#8B5E00" stroke-width="1" opacity="0.5"/>
  <ellipse cx="100" cy="110" rx="88" ry="38" fill="none" stroke="#8B5E00" stroke-width="1" opacity="0.4"/>

  <!-- Engraved lotus/floral on front -->
  <!-- Left floral -->
  <ellipse cx="28" cy="110" rx="8" ry="4" fill="#C8860A" stroke="#7A4F00" stroke-width="0.8"/>
  <ellipse cx="28" cy="110" rx="5" ry="2.5" fill="#FFD060" opacity="0.6"/>

  <!-- Right floral -->
  <ellipse cx="172" cy="110" rx="8" ry="4" fill="#C8860A" stroke="#7A4F00" stroke-width="0.8"/>
  <ellipse cx="172" cy="110" rx="5" ry="2.5" fill="#FFD060" opacity="0.6"/>

  <!-- Top floral / center gem -->
  <circle cx="100" cy="78" r="10" fill="url(#kadaFace)" stroke="#7A4F00" stroke-width="1.2"/>
  <circle cx="100" cy="78" r="6" fill="#CC2277" stroke="#8B5E00" stroke-width="0.8"/>
  <circle cx="97" cy="75" r="2.5" fill="white" opacity="0.4"/>

  <!-- Petal details around top gem -->
  <ellipse cx="100" cy="65" rx="4" ry="6" fill="#C8860A" stroke="#7A4F00" stroke-width="0.7" opacity="0.8"/>
  <ellipse cx="88" cy="68" rx="4" ry="6" fill="#C8860A" stroke="#7A4F00" stroke-width="0.7" opacity="0.8" transform="rotate(-40,88,68)"/>
  <ellipse cx="112" cy="68" rx="4" ry="6" fill="#C8860A" stroke="#7A4F00" stroke-width="0.7" opacity="0.8" transform="rotate(40,112,68)"/>

  <!-- Opening gap (kada is not fully closed) -->
  <rect x="130" y="86" width="18" height="48" rx="3" fill="#FFF8F0"/>
  <line x1="130" y1="90" x2="130" y2="130" stroke="#C8860A" stroke-width="1.5"/>
  <line x1="148" y1="90" x2="148" y2="130" stroke="#C8860A" stroke-width="1.5"/>

  <!-- Engrave lines on band body -->
  <path d="M40,95 Q100,82 160,95" fill="none" stroke="#FFE97A" stroke-width="0.8" opacity="0.35"/>
  <path d="M38,125 Q100,138 162,125" fill="none" stroke="#FFE97A" stroke-width="0.8" opacity="0.35"/>
</svg>
