<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="payalChain" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF0A0"/>
      <stop offset="35%" stop-color="#C8860A"/>
      <stop offset="65%" stop-color="#8B5E00"/>
      <stop offset="100%" stop-color="#FFF0A0"/>
    </linearGradient>
    <radialGradient id="ghungroo" cx="30%" cy="25%" r="65%">
      <stop offset="0%" stop-color="#FFF0A0"/>
      <stop offset="55%" stop-color="#C8860A"/>
      <stop offset="100%" stop-color="#7A4F00"/>
    </radialGradient>
    <linearGradient id="ankBand" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFE97A"/>
      <stop offset="40%" stop-color="#C8860A"/>
      <stop offset="70%" stop-color="#8B5E00"/>
      <stop offset="100%" stop-color="#C8860A"/>
    </linearGradient>
  </defs>

  <!-- Main anklet band (elliptical, viewed slightly from above) -->
  <ellipse cx="100" cy="90" rx="82" ry="35" fill="none" stroke="url(#ankBand)" stroke-width="7"/>
  <!-- Band highlight -->
  <ellipse cx="100" cy="90" rx="82" ry="35" fill="none" stroke="#FFE97A" stroke-width="1.8" opacity="0.45"/>

  <!-- Chain links pattern on band -->
  <ellipse cx="100" cy="90" rx="73" ry="28" fill="none" stroke="#8B5E00" stroke-width="0.8" opacity="0.5"/>

  <!-- Decorative beads on the band -->
  <circle cx="18" cy="90" r="5" fill="url(#ghungroo)" stroke="#7A4F00" stroke-width="0.8"/>
  <circle cx="50" cy="60" r="4" fill="url(#ghungroo)" stroke="#7A4F00" stroke-width="0.8"/>
  <circle cx="100" cy="55" r="5" fill="url(#ghungroo)" stroke="#7A4F00" stroke-width="0.8"/>
  <circle cx="150" cy="60" r="4" fill="url(#ghungroo)" stroke="#7A4F00" stroke-width="0.8"/>
  <circle cx="182" cy="90" r="5" fill="url(#ghungroo)" stroke="#7A4F00" stroke-width="0.8"/>
  <circle cx="150" cy="120" r="4" fill="url(#ghungroo)" stroke="#7A4F00" stroke-width="0.8"/>
  <circle cx="100" cy="125" r="5" fill="url(#ghungroo)" stroke="#7A4F00" stroke-width="0.8"/>
  <circle cx="50" cy="120" r="4" fill="url(#ghungroo)" stroke="#7A4F00" stroke-width="0.8"/>

  <!-- Ghungroo bells hanging from bottom of anklet -->
  <!-- Each ghungroo: teardrop shaped bell -->

  <!-- Bell 1 -->
  <line x1="38" y1="118" x2="35" y2="130" stroke="#C8860A" stroke-width="1.5"/>
  <path d="M28,138 Q28,152 35,152 Q42,152 42,138 Q42,130 35,130 Q28,130 28,138 Z" fill="url(#ghungroo)" stroke="#7A4F00" stroke-width="1"/>
  <line x1="35" y1="148" x2="35" y2="152" stroke="#8B5E00" stroke-width="0.8"/>
  <ellipse cx="35" cy="136" rx="4" ry="2.5" fill="#FFE97A" opacity="0.4"/>

  <!-- Bell 2 -->
  <line x1="60" y1="122" x2="60" y2="134" stroke="#C8860A" stroke-width="1.5"/>
  <path d="M53,142 Q53,158 60,158 Q67,158 67,142 Q67,134 60,134 Q53,134 53,142 Z" fill="url(#ghungroo)" stroke="#7A4F00" stroke-width="1"/>
  <line x1="60" y1="154" x2="60" y2="158" stroke="#8B5E00" stroke-width="0.8"/>
  <ellipse cx="60" cy="140" rx="4" ry="2.5" fill="#FFE97A" opacity="0.4"/>

  <!-- Bell 3 (center, slightly larger) -->
  <line x1="100" y1="125" x2="100" y2="137" stroke="#C8860A" stroke-width="1.8"/>
  <path d="M92,146 Q92,164 100,164 Q108,164 108,146 Q108,137 100,137 Q92,137 92,146 Z" fill="url(#ghungroo)" stroke="#7A4F00" stroke-width="1.2"/>
  <line x1="100" y1="160" x2="100" y2="164" stroke="#8B5E00" stroke-width="1"/>
  <ellipse cx="100" cy="144" rx="5" ry="3" fill="#FFE97A" opacity="0.4"/>

  <!-- Bell 4 -->
  <line x1="140" y1="122" x2="140" y2="134" stroke="#C8860A" stroke-width="1.5"/>
  <path d="M133,142 Q133,158 140,158 Q147,158 147,142 Q147,134 140,134 Q133,134 133,142 Z" fill="url(#ghungroo)" stroke="#7A4F00" stroke-width="1"/>
  <line x1="140" y1="154" x2="140" y2="158" stroke="#8B5E00" stroke-width="0.8"/>
  <ellipse cx="140" cy="140" rx="4" ry="2.5" fill="#FFE97A" opacity="0.4"/>

  <!-- Bell 5 -->
  <line x1="162" y1="118" x2="165" y2="130" stroke="#C8860A" stroke-width="1.5"/>
  <path d="M158,138 Q158,152 165,152 Q172,152 172,138 Q172,130 165,130 Q158,130 158,138 Z" fill="url(#ghungroo)" stroke="#7A4F00" stroke-width="1"/>
  <line x1="165" y1="148" x2="165" y2="152" stroke="#8B5E00" stroke-width="0.8"/>
  <ellipse cx="165" cy="136" rx="4" ry="2.5" fill="#FFE97A" opacity="0.4"/>

  <!-- Clasp -->
  <rect x="172" y="84" width="18" height="12" rx="5" fill="url(#ghungroo)" stroke="#7A4F00" stroke-width="0.8"/>
  <circle cx="185" cy="90" r="3.5" fill="#8B5E00" opacity="0.5"/>
</svg>
