  <circle cx="114" cy="175" r="2.5" fill="#C8860A"/>
  <ellipse cx="114" cy="161" rx="3" ry="5" fill="#C8860A" stroke="#7A4F00" stroke-width="0.5"/>
  <ellipse cx="114" cy="161" rx="3" ry="5" fill="#C8860A" stroke="#7A4F00" stroke-width="0.5" transform="rotate(60,114,175)"/>
  <ellipse cx="114" cy="161" rx="3" ry="5" fill="#C8860A" stroke="#7A4F00" stroke-width="0.5" transform="rotate(120,114,175)"/>
  <ellipse cx="114" cy="161" rx="3" ry="5" fill="#C8860A" stroke="#7A4F00" stroke-width="0.5" transform="rotate(180,114,175)"/>
  <ellipse cx="114" cy="161" rx="3" ry="5" fill="#C8860A" stroke="#7A4F00" stroke-width="0.5" transform="rotate(240,114,175)"/>
