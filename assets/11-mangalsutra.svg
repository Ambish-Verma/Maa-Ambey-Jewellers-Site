  <circle cx="86" cy="175" r="14" fill="url(#msPendant)" stroke="#7A4F00" stroke-width="1.2"/>
  <circle cx="86" cy="175" r="9" fill="none" stroke="#FFE97A" stroke-width="0.8" opacity="0.5"/>
