  <circle cx="162" cy="101" r="5.5" fill="url(#msBlack)" stroke="#444" stroke-width="0.5"/>
  <circle cx="157" cy="117" r="5.5" fill="url(#msBlack)" stroke="#444" stroke-width="0.5"/>
  <circle cx="148" cy="132" r="5.5" fill="url(#msBlack)" stroke="#444" stroke-width="0.5"/>
  <circle cx="138" cy="146" r="5.5" fill="url(#msBlack)" stroke="#444" stroke-width="0.5"/>

